[eurostat]
enabled = true
dataset = "prc_hicp_minr"
geo = "DE"
# Passenger transport by air: overall, domestic, international.
coicop = ["CP0733", "CP07331", "CP07332"]
units = ["I25", "I15"]

[ryanair]
enabled = true
# Every German airport Ryanair serves.
airports = ["BER", "BRE", "CGN", "FDH", "FKB", "FMM", "FMO", "HAM", "HHN", "LBC", "NRN", "NUE", "PAD", "SCN"]
# One request per airport and day. Days without a flight just return nothing.
days_ahead = 45
currency = "EUR"
market = "de-de"
delay_seconds = 1.0
# Give up on the source after this many failed requests in a row.
max_consecutive_failures = 10

[wizzair]
# Off until the data has been checked over a few days.
enabled = false
# Every German airport Wizz Air serves. Its route map lists the destinations of each.
airports = ["BER", "CGN", "DTM", "FDH", "FKB", "FMM", "HAM", "HHN", "NUE", "STR"]
# Two timetable requests per route. Days without a flight are left out of the answer.
days_ahead = 45
currency = "EUR"
delay_seconds = 1.0
# The API version is read from Wizz Air's homepage on each run. If that fails, this one is used.
fallback_api_version = "29.24.0"
# Give up on the source after this many failed requests in a row.
max_consecutive_failures = 10
# Server errors come in bursts, so requests that failed are tried once more after this pause.
retry_cooldown_seconds = 60

[google_flights]
enabled = true
routes = [
  # Domestic
  "FRA-BER", "MUC-HAM",
  # Europe
  "FRA-LHR", "FRA-CDG", "MUC-BCN", "FRA-PMI", "MUC-ATH", "FRA-IST", "MUC-IST",
  # Long haul
  "FRA-JFK", "FRA-BKK",
]
# Each route tracks one departure a week, from when it comes within max_lead_days until it leaves.
min_lead_days = 1
max_lead_days = 60
currency = "EUR"
delay_seconds = 6.0
# Google's errors come in waves, so searches that fail are tried again later in the run, after a
# pause, up to this many passes in total.
passes = 3
pass_cooldown_seconds = 90.0
# Give up early only if this many searches fail in a row before any has worked, which looks like
# a block. After that a bad stretch doesn't stop the run, and what it collected is kept.
max_consecutive_failures = 5
# Stop starting searches after this long and keep what was collected.
time_budget_minutes = 25

[quality]
# Compare against up to this many earlier snapshots, once there are enough of them.
history_days = 14
min_history = 3
report_days = 30
# Any bad row is a warning. Above this share of rows, it's a failure.
bad_rows_fail_share = 0.01
row_count_warn_change = 0.2
row_count_fail_change = 0.5
median_price_warn_change = 0.25
median_price_fail_change = 0.5

[quality.eurostat]
# The newest month is normally 1-2 months old. One month older than this is a failure.
max_age_months_warn = 2
# The largest month-on-month move from 1996 to 2026-09 was 26%.
monthly_change_warn = 0.4

[quality.ryanair]
# Share of airport and week combinations with at least one fare. Small airports may have no
# flights in some weeks. Losing one airport costs about 0.07.
coverage_warn_below = 0.95
coverage_fail_below = 0.8
price_min = 1.0
price_max = 1000.0

[quality.wizzair]
# Share of airport and week combinations with at least one fare. Friedrichshafen and some
# other small airports have no flights in some weeks. Calibrate against real runs.
coverage_warn_below = 0.85
coverage_fail_below = 0.6
price_min = 5.0
price_max = 1000.0

[quality.google_flights]
# Share of tracked departures with a fare.
coverage_warn_below = 0.95
coverage_fail_below = 0.75
price_min = 10.0
price_max = 10000.0
